<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Quiz 🎤</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Karaoke Quiz 🎵</h1>

    <div id="player-count" class="player-count">Joueurs connectés: 0</div>

    <div id="song-info" class="song-info">
        <p id="artist"></p>
        <p id="title"></p>
    </div>

    <div id="question" class="question"></div>

    <div class="timer-container">
        <div id="timer" class="timer-bar"></div>
    </div>

    <button id="next-question">Question Suivante</button>

    <h2>Classement 🏆</h2>
    <ul id="scoreboard" class="scoreboard"></ul>

    <div id="log" class="log"></div>
</div>
<script src="app.js"></script>
</body>
</html>
